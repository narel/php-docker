# ---------------------------------------------------------------------------
# Shared Apache 2.4 configuration for the PHP 5.5+ / 7.x / 8.x images (mod_php).
#
# ${...} values come from environment variables exported by /run.sh. Apache
# does NOT start if any of them is undefined or empty - run.sh always sets
# defaults.
# ---------------------------------------------------------------------------

ServerRoot /etc/apache2
ServerName ${APACHE_SERVER_NAME}
DefaultRuntimeDir /var/run/apache2
PidFile /var/run/apache2/apache2.pid

Timeout 300
KeepAlive ${APACHE_KEEPALIVE}
MaxKeepAliveRequests 100
KeepAliveTimeout 5

User www-data
Group www-data
HostnameLookups Off

# --- information disclosure ------------------------------------------------
# Note: this file does not include conf-enabled/*, so Debian's security.conf
# is not loaded and these three directives have to be here.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- logs to the container stdout/stderr -----------------------------------
ErrorLog /dev/stderr
LogLevel warn
LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %O" common
LogFormat "%{Referer}i -> %U" referer
LogFormat "%{User-agent}i" agent
CustomLog /dev/stdout combined

IncludeOptional /etc/apache2/mods-enabled/*.load
IncludeOptional /etc/apache2/mods-enabled/*.conf

Listen 8000

DocumentRoot ${DOCUMENT_ROOT}
AccessFileName .htaccess

<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

<Directory ${DOCUMENT_ROOT}>
    # -Indexes by default. A site that really needs directory listing can
    # enable it in its .htaccess (AllowOverride All below), or globally with
    # -e APACHE_OPTIONS="+Indexes +FollowSymLinks".
    Options ${APACHE_OPTIONS}
    AllowOverride All
    Require all granted
</Directory>

# --- files that must never be served over HTTP ----------------------------
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>
<FilesMatch "^(\.env|\.user\.ini|composer\.lock)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(git|svn|hg|bzr)(/|$)">
    Require all denied
</DirectoryMatch>

# --- running behind a reverse proxy ---------------------------------------
<IfModule mod_setenvif.c>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>
<IfModule mod_remoteip.c>
    # Without RemoteIPTrustedProxy any client can spoof X-Forwarded-For - do not
    # remove this directive, narrow it down to your proxy's IP instead.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy ${APACHE_TRUSTED_PROXIES}
</IfModule>

# --- user configuration (virtual hosts, Alias, <Directory>) ---------------
# Last, so that virtual hosts inherit everything above. The Dockerfile creates
# the directory: Apache 2.4.7/2.4.10 (5.x images) fails to start without it,
# despite "Optional".
IncludeOptional /etc/apache2/conf.d/*.conf
