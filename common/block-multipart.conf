# ---------------------------------------------------------------------------
# Optional layer for CVE-2026-109618/109619 (see README). Blocks
# multipart/form-data requests (file uploads) for the whole server or for a
# chosen directory, before they reach PHP.
#
# USE ONLY where the application does NOT accept file uploads - otherwise you
# will block your own forms. session.upload_progress.enabled = 0 (the default
# in this project, common/php.conf) already closes the vulnerable
# CVE-2026-109619 path at the PHP level; this file is an extra layer, useful
# mainly on the unpatched 7.x and 5.x images, where someone could re-enable
# session.upload_progress.enabled = 1 locally.
# It does not protect against CVE-2026-109618 (memory exhaustion, not uploads).
#
# Enable for the whole server:
#   mount this file (or a copy) as /etc/apache2/conf.d/*.conf
#
# Enable for a single directory/application:
#   move RewriteEngine/RewriteCond/RewriteRule into a <Directory> block or
#   into that application's .htaccess (requires AllowOverride All, see README)
# ---------------------------------------------------------------------------
RewriteEngine On
RewriteCond %{REQUEST_METHOD} ^(POST|PUT|PATCH)$ [NC]
RewriteCond %{HTTP:Content-Type} ^[[:space:]]*multipart/form-data([;,[:space:]]|$) [NC]
RewriteRule ^ - [F,L]
