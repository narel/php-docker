# prefork MPM - the only MPM compatible with mod_php.
# Tuned through environment variables, see README.
# ServerLimit equals MaxRequestWorkers, so the default limit of 256 can be
# exceeded without an extra directive.
<IfModule mpm_prefork_module>
    ServerLimit              ${APACHE_MAX_WORKERS}
    StartServers             ${APACHE_START_SERVERS}
    MinSpareServers          ${APACHE_MIN_SPARE}
    MaxSpareServers          ${APACHE_MAX_SPARE}
    MaxRequestWorkers        ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild   ${APACHE_MAX_REQUESTS_PER_CHILD}
</IfModule>
