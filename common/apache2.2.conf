# ---------------------------------------------------------------------------
# Shared Apache 2.2 configuration for the PHP 5.2 / 5.3 / 5.4 images
# (lenny, squeeze, wheezy). Equivalent of common/apache2.conf, but with 2.2
# syntax: Order/Allow instead of Require, MaxClients instead of
# MaxRequestWorkers, no mod_remoteip (added only in Apache 2.4).
#
# ${...} values come from variables exported by /run.sh.
# ---------------------------------------------------------------------------

# Explicit ServerRoot: on Apache 2.2.9 (lenny) relative Include paths do not
# resolve without it.
ServerRoot /etc/apache2

ServerName ${APACHE_SERVER_NAME}
LockFile /var/run/apache2/accept.lock
PidFile /var/run/apache2/apache2.pid

Timeout 300
KeepAlive ${APACHE_KEEPALIVE}
MaxKeepAliveRequests 100
KeepAliveTimeout 5

<IfModule mpm_prefork_module>
    ServerLimit           ${APACHE_MAX_WORKERS}
    StartServers          ${APACHE_START_SERVERS}
    MinSpareServers       ${APACHE_MIN_SPARE}
    MaxSpareServers       ${APACHE_MAX_SPARE}
    MaxClients            ${APACHE_MAX_WORKERS}
    MaxRequestsPerChild   ${APACHE_MAX_REQUESTS_PER_CHILD}
</IfModule>

User www-data
Group www-data
HostnameLookups Off
DefaultType text/plain

# --- information disclosure ------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- logs to the container stdout/stderr -----------------------------------
ErrorLog /dev/stderr
LogLevel warn
LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %O" common
LogFormat "%{Referer}i -> %U" referer
LogFormat "%{User-agent}i" agent
CustomLog /dev/stdout combined

Include /etc/apache2/mods-enabled/*.load
Include /etc/apache2/mods-enabled/*.conf

Listen 8000

DocumentRoot ${DOCUMENT_ROOT}
AccessFileName .htaccess

<Directory />
    Options FollowSymLinks
    AllowOverride None
    Order deny,allow
    Deny from all
</Directory>

<Directory ${DOCUMENT_ROOT}>
    Options ${APACHE_OPTIONS}
    AllowOverride All
    Order allow,deny
    Allow from all
</Directory>

# --- files that must never be served over HTTP ----------------------------
<FilesMatch "^\.ht">
    Order allow,deny
    Deny from all
    Satisfy all
</FilesMatch>
<FilesMatch "^(\.env|\.user\.ini|composer\.lock)$">
    Order allow,deny
    Deny from all
    Satisfy all
</FilesMatch>
<DirectoryMatch "/\.(git|svn|hg|bzr)(/|$)">
    Order allow,deny
    Deny from all
    Satisfy all
</DirectoryMatch>

# --- running behind a reverse proxy ---------------------------------------
# Apache 2.2 has no mod_remoteip - REMOTE_ADDR stays the proxy address.
<IfModule mod_setenvif.c>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>

# --- user configuration (virtual hosts, Alias, <Directory>) ---------------
# Debian's own files in conf.d have no .conf extension, so they are not included.
# Multiple virtual hosts on 2.2 need "NameVirtualHost *:8000" in the user's file.
Include /etc/apache2/conf.d/*.conf
