; ---------------------------------------------------------------------------
; Shared PHP configuration for all images (loaded as conf.d/90-docker.ini).
; Directives unknown to older PHP versions are silently ignored, so this file
; is safe for everything from PHP 5.2 up to 8.5.
;
; Per-site overrides: mount a directory of *.ini files at /etc/php_config
; (copied into conf.d at start-up). Use the 99- prefix to win over this file.
; ---------------------------------------------------------------------------

; --- resource limits -------------------------------------------------------
max_execution_time = 60
max_input_time = 180
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; --- legacy code compatibility ---------------------------------------------
short_open_tag = On

; --- sessions --------------------------------------------------------------
session.gc_probability = 1
session.gc_maxlifetime = 3600
session.cookie_httponly = 1      ; PHP 5.2+   (blocks reading the cookie from JS)
session.use_strict_mode = 1      ; PHP 5.5.2+ (blocks session fixation)
session.cookie_samesite = Lax    ; PHP 7.3+   (see README - the most likely setting
                                 ; to relax for payment gateway callbacks)
; PHP 5.4+. Rarely used, and one of the two confirmed paths to RCE in
; CVE-2026-109619 - PHP recommends disabling it even after patching.
session.upload_progress.enabled = 0

; --- errors ----------------------------------------------------------------
; PHP 8.5+. The fatal error backtrace is the producer in the confirmed RCE
; from CVE-2026-109619. Cost: fatal errors are logged without a stack trace.
fatal_error_backtraces = 0

; --- information disclosure ------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
